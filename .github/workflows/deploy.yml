name: Deploy till One.com

# Södra Låsteknik driftas på One.com (inte Loopia). One.com använder SFTP,
# inte FTPS. Denna workflow laddar upp sajten via SFTP vid varje push till main.
#
# INNAN DEN FUNGERAR – gör detta en gång:
#   1. Skapa ett SFTP-lösenord i One.coms kontrollpanel (Filhantering → SFTP/SSH).
#   2. Lägg in repo-secrets (Settings → Secrets and variables → Actions):
#        SFTP_SERVER    – One.coms SFTP-värd, t.ex. ssh.one.com
#        SFTP_USERNAME  – ditt One.com-användarnamn (ofta domänen)
#        SFTP_PASSWORD  – SFTP-lösenordet från steg 1
#   3. Bekräfta remote_path nedan mot One.coms webbrot för domänen.
#      På One.com ligger den publika webbroten oftast i mappen som visas
#      när du loggar in via SFTP (t.ex. "/" eller "/www"). Kontrollera i panelen.
#
# Alternativ tills detta är satt: ladda upp filerna manuellt via en SFTP-klient
# (t.ex. FileZilla mot ssh.one.com) – allt utom filerna i "exclude" nedan.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checka ut koden
        uses: actions/checkout@v4

      - name: Ladda upp via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          server: ${{ secrets.SFTP_SERVER }}
          username: ${{ secrets.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }}
          port: 22
          local_path: './*'
          # TODO: bekräfta One.coms webbrot för sodralasteknik.se
          remote_path: '/'
          exclude: |
            **/.git*
            **/.github/**
            venv/**
            __pycache__/**
            PROJEKT.md
            README.md
            CLAUDE.md
            serve.py
            .editorconfig
            .gitignore
