name: Deploy till One.com

# Södra Låsteknik driftas på One.com. FTP är avstängt av One.com – vi använder SFTP.
# Denna workflow laddar upp sajten till One.coms publika webbrot vid varje push till main.
#
# One.com: när du loggar in via SFTP landar du DIREKT i din publika webbrot
# (httpd.www). Därför laddas filerna upp till nuvarande katalog "." – inte till
# en undermapp "httpd.www/" (det skapar httpd.www/httpd.www och sajten hamnar fel).
# Absoluta roten "/" är skrivskyddad och får inte användas.
#
# Webbroten innehåller en gammal Website Builder-sajt. mirror --delete ersätter hela
# webbroten med VÅR sajt (byggarens filer tas bort). Säkert: e-post, backups och
# httpd.private ligger utanför webbroten och nås inte härifrån. Den gamla sajten kan
# återskapas genom att publicera om i Website Builder. ms*.txt (domänverifiering) och
# .well-known undantas för säkerhets skull.
#
# Kräver repo-secrets (Settings → Secrets and variables → Actions):
#   SFTP_SERVER    – One.coms SFTP-värd, t.ex. ssh.xxxxxxxx.service.one
#   SFTP_USERNAME  – SFTP-användarnamnet, t.ex. xxxxxxxx_ssh
#   SFTP_PASSWORD  – SFTP-lösenordet (skapas i One.coms panel → Hostinginställningar → SSH & SFTP)
#
# Interna filer (dokumentation, dev-server) publiceras inte – de rensas bort i
# "Förbered publiceringsmapp" innan uppladdning. Ändra listan där vid behov.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checka ut koden
        uses: actions/checkout@v4

      - name: Förbered publiceringsmapp (exkludera interna filer)
        run: |
          mkdir -p dist
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='dist' \
            --exclude='*.docx' \
            --exclude='PROJEKT.md' \
            --exclude='README.md' \
            --exclude='CLAUDE.md' \
            --exclude='serve.py' \
            --exclude='.gitignore' \
            --exclude='.editorconfig' \
            ./ dist/

      - name: Ladda upp till One.com (httpd.www) via SFTP
        env:
          LFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_SERVER: ${{ secrets.SFTP_SERVER }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          echo "=== pwd + ls FORE, mirror, ls EFTER ==="
          lftp -u "$SFTP_USERNAME" --env-password sftp://"$SFTP_SERVER" <<'EOF'
          set sftp:auto-confirm yes
          set net:max-retries 2
          set net:timeout 20
          pwd
          ls
          mirror -R --verbose --no-perms ./dist/ ./
          pwd
          ls
          bye
          EOF
