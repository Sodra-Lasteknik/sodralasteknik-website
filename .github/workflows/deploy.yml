name: Deploy till One.com

# Södra Låsteknik driftas på One.com (ny "cloud"-plattform). FTP är avstängt – vi använder SFTP.
# Laddar upp sajten till webbroten vid varje push till main.
#
# VIKTIGT om katalogstrukturen på det här kontot (bekräftat via diagnostik):
#   SFTP-användaren landar i sin hemkatalog:
#     /customers/f/0/f/clvdci9yf/users/<user>
#   Det är INTE webbroten. Den riktiga webbroten ligger i:
#     /customers/f/0/f/clvdci9yf/webroots/www
#   dvs. "../../webroots/www/" räknat från hemkatalogen. Mappen ägs av SFTP-användaren
#   (skrivbar). Absoluta "/" är skrivskyddad. httpd.www finns inte på den här plattformen.
#
# Kräver repo-secrets (Settings → Secrets and variables → Actions):
#   SFTP_SERVER    – t.ex. ssh.xxxxxxxx.service.one
#   SFTP_USERNAME  – t.ex. xxxxxxxx_ssh
#   SFTP_PASSWORD  – SFTP-lösenordet (One.com → Hostinginställningar → SSH & SFTP)
#
# Interna filer (dokumentation, dev-server) publiceras inte – de rensas bort i
# "Förbered publiceringsmapp" innan uppladdning.
#
# --delete håller webbroten = exakt vår sajt och rensar bort den gamla Website
# Builder-sajtens filer vid varje deploy. Undantag (rörs ej): .htaccess (HTTPS-
# omdirigering), ms*.txt (domänverifiering), .well-known (SSL/verifiering) och
# tmp-onehopmigration* (One.coms egna migreringsmappar).

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checka ut koden
        uses: actions/checkout@v4

      - name: Förbered publiceringsmapp (exkludera interna filer)
        run: |
          mkdir -p dist
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='dist' \
            --exclude='*.docx' \
            --exclude='PROJEKT.md' \
            --exclude='README.md' \
            --exclude='CLAUDE.md' \
            --exclude='serve.py' \
            --exclude='.gitignore' \
            --exclude='.editorconfig' \
            ./ dist/

      - name: Ladda upp till One.com (webroots/www) via SFTP
        env:
          LFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_SERVER: ${{ secrets.SFTP_SERVER }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          lftp -u "$SFTP_USERNAME" --env-password sftp://"$SFTP_SERVER" <<'EOF'
          set sftp:auto-confirm yes
          set net:max-retries 2
          set net:timeout 20
          mirror -R --verbose --no-perms --delete --exclude-glob 'ms*.txt' --exclude '\.htaccess' --exclude '\.well-known' --exclude 'tmp-onehopmigration' ./dist/ ../../webroots/www/
          ls ../../webroots/www
          bye
          EOF
